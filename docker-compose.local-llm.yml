# Compatibility override for the old way of running the LLM on this machine:
#   docker compose -f docker-compose.yml -f docker-compose.local-llm.yml up -d
# Prefer the .env switch now (AEROTWIN_LOCAL_LLM=true plus COMPOSE_PROFILES=local-llm, see .env.example and
# DEPLOYMENT.md): the llm service and its model download live in docker-compose.yml. This file only enables
# that service without the profile, turns the switch on and passes the old timeout/concurrency settings.
services:
  llm:
    # Needs Compose >= 2.24 for !reset.
    profiles: !reset []

  backend:
    environment:
      AEROTWIN_LOCAL_LLM: "true"
      # CPU inference takes minutes per agent: the 60 s cloud default would time every call out. One agent at a
      # time keeps a small board from swapping (llama.cpp serves one request at a time here anyway).
      AEROTWIN_OPENAI_TIMEOUT_SECONDS: ${AEROTWIN_LLM_TIMEOUT_SECONDS:-1800}
      AEROTWIN_AGENT_CONCURRENCY: ${AEROTWIN_LLM_AGENT_CONCURRENCY:-1}
