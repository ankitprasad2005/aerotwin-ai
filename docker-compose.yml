services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aerotwin
      POSTGRES_PASSWORD: aerotwin
      POSTGRES_DB: aerotwin
    ports:
      - "5432:5432"
    volumes:
      - aerotwin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerotwin"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      AEROTWIN_DATABASE_URL: postgresql+asyncpg://aerotwin:aerotwin@postgres:5432/aerotwin
      AEROTWIN_OPENAI_API_KEY: ${AEROTWIN_OPENAI_API_KEY:-}
      AEROTWIN_OPENAI_MODEL: ${AEROTWIN_OPENAI_MODEL:-gpt-4o-mini}
      AEROTWIN_CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  # The frontend/ directory doesn't exist yet (separate Frontend plan, not part of
  # Phase 1 backend). This service is forward-looking scaffolding: `docker compose
  # up` with no service filter will fail on a missing build context until then —
  # use `docker compose up postgres backend` to run just the backend stack.
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_WS_BASE_URL: ws://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  aerotwin_postgres_data:
