services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aerotwin
      POSTGRES_PASSWORD: aerotwin
      POSTGRES_DB: aerotwin
    ports:
      - "5432:5432"
    volumes:
      - aerotwin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerotwin"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      AEROTWIN_DATABASE_URL: postgresql+asyncpg://aerotwin:aerotwin@postgres:5432/aerotwin
      AEROTWIN_OPENAI_API_KEY: ${AEROTWIN_OPENAI_API_KEY:-}
      AEROTWIN_OPENAI_MODEL: ${AEROTWIN_OPENAI_MODEL:-gpt-4o-mini}
      # Blank means the OpenAI default. Set it to use any OpenAI-compatible endpoint that
      # supports json_schema structured outputs, e.g. an Azure AI Foundry ".../openai/v1".
      AEROTWIN_OPENAI_BASE_URL: ${AEROTWIN_OPENAI_BASE_URL:-}
      # Checked against the browser's Origin header, so it must be the frontend's
      # HOST-published port (below), not its container-internal one. Origins from other
      # devices/containers on the LAN are covered by AEROTWIN_CORS_ORIGIN_REGEX's default.
      AEROTWIN_CORS_ORIGINS: '["http://localhost:3005"]'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # host:container — the app still listens on 8000 inside the container;
      # only the host-side published port changes.
      - "8005:8000"

  frontend:
    build: ./frontend
    environment:
      # The dev server proxies /api and /ws to the backend, so the browser only ever talks to the
      # frontend's own origin — no second reachable port, no CORS, and it works the same from the
      # Docker host, another device, a browser container or a tunnel. This target is resolved by
      # the dev server itself (inside the Docker network), not by the browser, so the service name
      # is correct here.
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      # host:container — the dev server still listens on 5173 inside the container;
      # only the host-side published port changes.
      - "3005:5173"

volumes:
  aerotwin_postgres_data:
