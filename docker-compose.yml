services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aerotwin
      POSTGRES_PASSWORD: aerotwin
      POSTGRES_DB: aerotwin
    ports:
      - "5432:5432"
    volumes:
      - aerotwin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerotwin"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Private metasearch engine for web evidence. No host port: only the backend reaches it, over the
  # compose network. Settings (JSON API on, limiter off) come from ./searxng/settings.yml.
  searxng:
    image: searxng/searxng:2026.10.13-22c64b8d3
    environment:
      # Overrides server.secret_key. The default is a local placeholder; set a real value in .env.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-dev-only-change-me}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  # On-device LLM (llama.cpp, OpenAI-compatible) for running inference on this machine, e.g. a Radxa ROCK 5C.
  # Behind the "local-llm" profile, so a default install never pulls or starts it. Turn it on in .env with
  # AEROTWIN_LOCAL_LLM=true plus COMPOSE_PROFILES=local-llm. No host port: only the backend reaches it.
  llm:
    # Official llama.cpp server, multi-arch (amd64 and arm64).
    image: ghcr.io/ggml-org/llama.cpp:server-b11681
    profiles: [local-llm]
    environment:
      # -hf downloads into this cache (a named volume) on first start; later starts reuse the file.
      LLAMA_CACHE: /cache
      AEROTWIN_LLM_HF_REPO: ${AEROTWIN_LLM_HF_REPO:-Qwen/Qwen2.5-1.5B-Instruct-GGUF}
      AEROTWIN_LLM_HF_FILE: ${AEROTWIN_LLM_HF_FILE:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      # Air-gapped sites: a GGUF file name inside AEROTWIN_LLM_MODEL_DIR (scripts/fetch-local-model.sh).
      # When set, that file is loaded and nothing is downloaded.
      AEROTWIN_LLM_MODEL_FILE: ${AEROTWIN_LLM_MODEL_FILE:-}
      AEROTWIN_LLM_ALIAS: ${AEROTWIN_LLM_ALIAS:-local}
      # Agent prompts with their evidence reach about 17k tokens (the Finance agent), so 8k is too small. 32k is
      # Qwen2.5's native limit; its KV cache costs about 0.9 GB for the 1.5B model.
      AEROTWIN_LLM_CTX: ${AEROTWIN_LLM_CTX:-32768}
      # Cap on generated tokens per request. Real agent outputs average ~500 tokens (max ~2,000); without a cap a
      # small model that loops inside the JSON grammar generates until the backend's timeout (30 min) cancels it.
      AEROTWIN_LLM_MAX_TOKENS: ${AEROTWIN_LLM_MAX_TOKENS:-2048}
      # Small models tend to repeat list items (cited_sources) until the cap; a mild penalty makes them close
      # the list. Measured with Qwen2.5-0.5B on the Network prompt: 3 of 4 replies looped at 1.0, 0 of 3 at 1.1.
      AEROTWIN_LLM_REPEAT_PENALTY: ${AEROTWIN_LLM_REPEAT_PENALTY:-1.1}
      # 4 threads = the ROCK 5C's four Cortex-A76 performance cores.
      AEROTWIN_LLM_THREADS: ${AEROTWIN_LLM_THREADS:-4}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$AEROTWIN_LLM_MODEL_FILE" ]; then
          set -- -m "/models/$$AEROTWIN_LLM_MODEL_FILE"
        else
          set -- -hf "$$AEROTWIN_LLM_HF_REPO" -hff "$$AEROTWIN_LLM_HF_FILE"
        fi
        exec /app/llama-server "$$@" --host 0.0.0.0 --port 8080 --alias "$$AEROTWIN_LLM_ALIAS" \
          --ctx-size "$$AEROTWIN_LLM_CTX" --threads "$$AEROTWIN_LLM_THREADS" --parallel 1 \
          --n-predict "$$AEROTWIN_LLM_MAX_TOKENS" --repeat-penalty "$$AEROTWIN_LLM_REPEAT_PENALTY"
    volumes:
      - aerotwin_llm_models:/cache
      - ${AEROTWIN_LLM_MODEL_DIR:-./models}:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      # The first start downloads ~1.1 GB before the server listens; failures inside start_period don't count,
      # and start_interval polls quickly so a cached model reports healthy within seconds.
      start_period: 15m
      start_interval: 5s
      interval: 30s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    environment:
      AEROTWIN_DATABASE_URL: postgresql+asyncpg://aerotwin:aerotwin@postgres:5432/aerotwin
      AEROTWIN_OPENAI_API_KEY: ${AEROTWIN_OPENAI_API_KEY:-}
      AEROTWIN_OPENAI_MODEL: ${AEROTWIN_OPENAI_MODEL:-gpt-4o-mini}
      # Blank means the OpenAI default. Set it to use any OpenAI-compatible endpoint that
      # supports json_schema structured outputs, e.g. an Azure AI Foundry ".../openai/v1".
      AEROTWIN_OPENAI_BASE_URL: ${AEROTWIN_OPENAI_BASE_URL:-}
      # Checked against the browser's Origin header, so it must be the frontend's
      # HOST-published port (below), not its container-internal one. Origins from other
      # devices/containers on the LAN are covered by AEROTWIN_CORS_ORIGIN_REGEX's default.
      # Override in .env (a JSON list) to add public origins such as a domain behind a reverse proxy.
      AEROTWIN_CORS_ORIGINS: '${AEROTWIN_CORS_ORIGINS:-["http://localhost:3005"]}'
      AEROTWIN_SEARXNG_URL: http://searxng:8080
      # On-device inference switch (see the llm service). When true the backend uses the llm service in place of
      # the AEROTWIN_OPENAI_* endpoint and defaults to a CPU-sized timeout (1800 s) and one agent at a time;
      # AEROTWIN_OPENAI_TIMEOUT_SECONDS / AEROTWIN_AGENT_CONCURRENCY are deliberately not passed here so those
      # defaults apply (docker-compose.local-llm.yml shows how to set them explicitly).
      AEROTWIN_LOCAL_LLM: ${AEROTWIN_LOCAL_LLM:-false}
      AEROTWIN_LOCAL_LLM_BASE_URL: http://llm:8080/v1
      AEROTWIN_LOCAL_LLM_MODEL: ${AEROTWIN_LLM_ALIAS:-local}
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
      # Waits for the model to load when the local-llm profile is on; ignored when it is off.
      llm:
        condition: service_healthy
        required: false
    volumes:
      # Downloaded datasets (OpenFlights, EIA, DGCA) persist across container rebuilds.
      - aerotwin_datasets:/app/data/datasets
    ports:
      # host:container — the app still listens on 8000 inside the container;
      # only the host-side published port changes.
      - "8005:8000"

  frontend:
    build: ./frontend
    environment:
      # The dev server proxies /api and /ws to the backend, so the browser only ever talks to the
      # frontend's own origin — no second reachable port, no CORS, and it works the same from the
      # Docker host, another device, a browser container or a tunnel. This target is resolved by
      # the dev server itself (inside the Docker network), not by the browser, so the service name
      # is correct here.
      VITE_PROXY_TARGET: http://backend:8000
      # The dev server only answers Host headers it knows. It allows the hosts of the same CORS origins the
      # backend accepts, so adding a domain to AEROTWIN_CORS_ORIGINS in .env covers both. VITE_ALLOWED_HOSTS
      # adds more (".example.com" for subdomains, "all" to disable the check); VITE_HMR_CLIENT_PORT=443 makes
      # hot reload work behind an HTTPS reverse proxy.
      AEROTWIN_CORS_ORIGINS: '${AEROTWIN_CORS_ORIGINS:-["http://localhost:3005"]}'
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
      VITE_HMR_CLIENT_PORT: ${VITE_HMR_CLIENT_PORT:-}
    depends_on:
      - backend
    ports:
      # host:container — the dev server still listens on 5173 inside the container;
      # only the host-side published port changes.
      - "3005:5173"

volumes:
  aerotwin_postgres_data:
  aerotwin_datasets:
  # GGUF weights downloaded by the llm service (Hugging Face cache).
  aerotwin_llm_models:
